x-app-environment: &app-env
  DATABASE_URL: postgresql://personal_gpt:personal_gpt@postgres:5432/personal_gpt
  REDIS_URL: redis://redis:6379
  ES_NODE: http://elasticsearch:9200
  NEO4J_URI: bolt://neo4j:7687
  MILVUS_ADDRESS: milvus:19530
  VECTOR_BACKEND: milvus
  MINIO_ENDPOINT: http://app-minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-pgpt_minio}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-pgpt_minio_dev_secret}
  MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
  ENABLE_GRAPH_RAG: "true"
  # Docker Desktop 会把主机代理注成 127.0.0.1，容器内无效；改走宿主机网关
  HTTP_PROXY: ${DOCKER_HTTP_PROXY:-http://host.docker.internal:7897}
  HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-http://host.docker.internal:7897}
  NO_PROXY: localhost,127.0.0.1,::1,postgres,redis,elasticsearch,neo4j,milvus,app-minio,agent-service,web,ingest-worker,personal_gpt_web,personal_gpt_agent
  METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-pgpt_metrics_dev}

services:
  postgres:
    image: postgres:16-alpine
    container_name: personal_gpt_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: personal_gpt
      POSTGRES_PASSWORD: personal_gpt
      POSTGRES_DB: personal_gpt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_gpt -d personal_gpt"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: personal_gpt_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Elasticsearch 8.17 + IK（BM25 / 中文分词；Wave1 D-14）
  elasticsearch:
    build: ./docker/elasticsearch
    container_name: personal_gpt_elasticsearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Milvus standalone（Wave3 STORE-01；依赖 etcd + minio）
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: personal_gpt_milvus_etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: personal_gpt_milvus_minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.25
    container_name: personal_gpt_milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # Neo4j Graph RAG（Wave4 STORE-01 / RAG-06；窄域奶茶种子图）
  neo4j:
    image: neo4j:5.26-community
    container_name: personal_gpt_neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # Application uploads (D-32); separate from milvus-minio (RESEARCH A5)
  app-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: personal_gpt_app_minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pgpt_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-pgpt_minio_dev_secret}
    volumes:
      - app_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: personal_gpt_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      <<: *app-env
      NODE_ENV: production
      WEB_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AGENT_SERVICE_URL: http://agent-service:3002
      MONOREPO_ROOT: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
      app-minio:
        condition: service_healthy

  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
    container_name: personal_gpt_agent
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      <<: *app-env
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      AGENT_SERVICE_PORT: "3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  ingest-worker:
    build:
      context: .
      dockerfile: apps/ingest-worker/Dockerfile
    container_name: personal_gpt_ingest_worker
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      <<: *app-env
      NODE_ENV: production
      INGEST_WORKER_PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
      app-minio:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: personal_gpt_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.5.2
    container_name: personal_gpt_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  es_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
  neo4j_data:
  app_minio_data:
  prometheus_data:
  grafana_data:
