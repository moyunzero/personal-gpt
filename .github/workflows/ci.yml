name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# 同分支新 push 进来时，取消上一次还没跑完的运行，节省 Actions 配额。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Format & lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

  validate:
    name: Monorepo validate
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: web
            command: validate
          - workspace: ingest-worker
            command: validate
          - workspace: agent-service
            command: validate

    # lib/env.ts 在首次访问 env.* 时用 Zod 校验；next build 会收集 API route 元数据。
    # 真实值由 Vercel Project 注入到 Production / Preview。
    env:
      ASTRA_DB_COLLECTION: ci_dummy_collection
      ASTRA_DB_API_ENDPOINT: https://ci-dummy.example.com
      ASTRA_DB_APPLICATION_TOKEN: AstraCS:ci-dummy-token
      GOOGLE_GENERATIVE_AI_API_KEY: ci-dummy-google-key
      GROQ_API_KEY: ci-dummy-groq-key
      NIM_API_KEY: ci-dummy-nim-key
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate ${{ matrix.workspace }}
        run: yarn workspace ${{ matrix.workspace }} ${{ matrix.command }}

  regression-phase-1:
    name: v1.0 regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRA_DB_COLLECTION: ci_dummy_collection
      ASTRA_DB_API_ENDPOINT: https://ci-dummy.example.com
      ASTRA_DB_APPLICATION_TOKEN: AstraCS:ci-dummy-token
      GOOGLE_GENERATIVE_AI_API_KEY: ci-dummy-google-key
      GROQ_API_KEY: ci-dummy-groq-key
      NIM_API_KEY: ci-dummy-nim-key
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run v1.0 regression suite
        run: yarn test tests/regression/phase-1
