name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# 同分支新 push 进来时，取消上一次还没跑完的运行，节省 Actions 配额。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Monorepo validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: web
            command: validate
          - workspace: ingest-worker
            command: validate

    # lib/env.ts 在模块加载时用 Zod 校验必需变量，缺一个就抛错。
    # 真实值由 Vercel Project 注入到 Production / Preview。
    env:
      ASTRA_DB_COLLECTION: ci_dummy_collection
      ASTRA_DB_API_ENDPOINT: https://ci-dummy.example.com
      ASTRA_DB_APPLICATION_TOKEN: AstraCS:ci-dummy-token
      OPENROUTER_API_KEY: sk-or-ci-dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate ${{ matrix.workspace }}
        run: yarn workspace ${{ matrix.workspace }} ${{ matrix.command }}
