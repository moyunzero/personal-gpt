<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal · Emotion GPT — UI 设计稿 v1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
      Emotion GPT / 树洞定位：
      - 侧栏像「夜里的树洞」——深暖褐炭，安静、可倾诉
      - 主区像「暖光纸面」——象牙暖白
      - 强调色用「暮色玫瑰」——情绪温度（标题「树洞」本身不加色、不斜体）
    */
      :root {
        --ink: #2c241f;
        --ink-soft: #52463f;
        --muted: #8a7d74;
        --line: #ebe4dc;
        --line-strong: #ddd3c8;
        --paper: #f7f2ec;
        --paper-elevated: #fffaf5;
        --sidebar: #1c1714;
        --sidebar-hover: #29231f;
        --sidebar-active: #332c27;
        --accent: #b36b5c;
        --accent-soft: #f5e8e3;
        --accent-hover: #9a574a;
        --glow: rgba(179, 107, 92, 0.16);
        --danger: #a63d2f;
        --shadow: 0 1px 2px rgba(44, 36, 31, 0.04), 0 10px 28px rgba(44, 36, 31, 0.07);
        --radius: 14px;
        --font-display: "Instrument Serif", Georgia, serif;
        --font-ui: "Outfit", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--font-ui);
        background: var(--paper);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      .app {
        display: grid;
        grid-template-columns: 272px 1fr;
        height: 100vh;
        overflow: hidden;
      }

      /* —— Sidebar —— */
      .sidebar {
        background: var(--sidebar);
        color: #ddd6cf;
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
        border-right: 1px solid #120f0d;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px 18px;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: linear-gradient(145deg, #d4a090 0%, #8a5246 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        position: relative;
      }
      .brand-mark::after {
        content: "";
        position: absolute;
        inset: 9px 8px 8px 9px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.35);
      }
      .brand-text {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .brand-name {
        font-family: var(--font-display);
        font-size: 18px;
        color: #f7f1eb;
        letter-spacing: 0.01em;
        line-height: 1.1;
      }
      .brand-sub {
        font-size: 11px;
        color: #9a8d84;
        font-weight: 400;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .new-chat {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 0 4px 14px;
        padding: 11px 14px;
        border-radius: 12px;
        border: 1px solid #3d342e;
        background: transparent;
        color: #f2ebe4;
        font: 500 13.5px/1 var(--font-ui);
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .new-chat:hover {
        background: var(--sidebar-hover);
        border-color: #564840;
      }
      .new-chat svg {
        opacity: 0.85;
      }

      .nav-section {
        padding: 0 6px;
        margin-bottom: 8px;
      }
      .nav-label {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #7a6e66;
        padding: 8px 8px 6px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #cfc4bb;
        font: 400 13.5px/1.2 var(--font-ui);
        text-align: left;
        cursor: pointer;
        transition:
          background 0.12s,
          color 0.12s;
      }
      .nav-item:hover {
        background: var(--sidebar-hover);
        color: #f5eee8;
      }
      .nav-item.active {
        background: var(--sidebar-active);
        color: #fff;
      }
      .nav-item svg {
        flex-shrink: 0;
        opacity: 0.7;
      }
      .nav-item.active svg {
        opacity: 1;
      }

      .thread-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 6px 12px;
        scrollbar-width: thin;
        scrollbar-color: #3d342e transparent;
      }
      .thread {
        display: block;
        width: 100%;
        padding: 10px 10px;
        margin-bottom: 2px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #b3a69c;
        font: 400 13px/1.35 var(--font-ui);
        text-align: left;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .thread:hover {
        background: var(--sidebar-hover);
        color: #ebe3db;
      }
      .thread.active {
        background: var(--sidebar-active);
        color: #fff;
      }

      .sidebar-foot {
        border-top: 1px solid #2e2723;
        padding: 12px 6px 4px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .workspace-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border-radius: 12px;
        background: var(--sidebar-hover);
        border: 1px solid #3d342e;
        cursor: pointer;
        text-align: left;
        color: inherit;
        width: 100%;
        font: inherit;
      }
      .workspace-pill:hover {
        border-color: #564840;
      }
      .ws-avatar {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .ws-meta {
        min-width: 0;
        flex: 1;
      }
      .ws-name {
        font-size: 13px;
        font-weight: 500;
        color: #f2ebe4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ws-email {
        font-size: 11px;
        color: #8a7e74;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* —— Main —— */
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background:
          radial-gradient(1100px 480px at 50% -8%, rgba(179, 107, 92, 0.1), transparent 58%),
          var(--paper);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 28px;
        border-bottom: 1px solid transparent;
      }
      .mode-switch {
        display: inline-flex;
        padding: 4px;
        background: #ebe4dc;
        border-radius: 999px;
        gap: 2px;
      }
      .mode-btn {
        border: 0;
        background: transparent;
        padding: 7px 16px;
        border-radius: 999px;
        font: 500 13px/1 var(--font-ui);
        color: var(--muted);
        cursor: pointer;
        transition: all 0.15s;
      }
      .mode-btn.active {
        background: var(--paper-elevated);
        color: var(--ink);
        box-shadow: var(--shadow);
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ghost-btn {
        border: 1px solid var(--line);
        background: var(--paper-elevated);
        color: var(--ink-soft);
        padding: 8px 14px;
        border-radius: 999px;
        font: 500 13px/1 var(--font-ui);
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .ghost-btn:hover {
        border-color: var(--line-strong);
        background: #fff;
      }
      .ghost-btn.accent {
        border-color: transparent;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .ghost-btn.accent:hover {
        background: #ead8d1;
      }

      .stage {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 24px 12px;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }

      .greeting {
        text-align: center;
        margin-bottom: 36px;
      }
      .greeting h1 {
        font-family: var(--font-display);
        font-size: clamp(36px, 5vw, 48px);
        font-weight: 400;
        letter-spacing: -0.02em;
        color: var(--ink);
        margin-bottom: 12px;
        line-height: 1.15;
      }
      .greeting p {
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
        max-width: 420px;
        margin: 0 auto;
        font-weight: 300;
      }

      .suggestions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 100%;
      }
      .chip {
        text-align: left;
        padding: 16px 18px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--paper-elevated);
        cursor: pointer;
        transition:
          border-color 0.15s,
          transform 0.15s,
          box-shadow 0.15s;
        font: inherit;
        color: inherit;
      }
      .chip:hover {
        border-color: var(--accent);
        box-shadow: var(--shadow);
        transform: translateY(-1px);
      }
      .chip-title {
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
        margin-bottom: 4px;
      }
      .chip-desc {
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.4;
      }

      /* composer */
      .composer-wrap {
        padding: 8px 24px 22px;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }
      .composer-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding: 0 4px;
      }
      .seed-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }
      .seed-toggle input {
        appearance: none;
        width: 16px;
        height: 16px;
        border: 1.5px solid var(--line-strong);
        border-radius: 4px;
        background: var(--paper-elevated);
        position: relative;
        cursor: pointer;
      }
      .seed-toggle input:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .seed-toggle input:checked::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 1px;
        width: 5px;
        height: 9px;
        border: solid #fff;
        border-width: 0 1.5px 1.5px 0;
        transform: rotate(45deg);
      }

      .composer {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        padding: 12px 12px 12px 16px;
        background: var(--paper-elevated);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .composer:focus-within {
        border-color: #d4b5a8;
        box-shadow:
          0 0 0 3px var(--glow),
          var(--shadow);
      }
      .composer textarea {
        flex: 1;
        border: 0;
        outline: 0;
        resize: none;
        background: transparent;
        font: 400 15px/1.5 var(--font-ui);
        color: var(--ink);
        min-height: 24px;
        max-height: 160px;
        padding: 6px 0;
      }
      .composer textarea::placeholder {
        color: #9a8f86;
      }
      .send {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 11px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .send:hover {
        background: var(--accent-hover);
      }
      .send:active {
        transform: scale(0.96);
      }

      .hint {
        text-align: center;
        margin-top: 12px;
        font-size: 12px;
        color: #9a8f86;
        font-weight: 300;
      }

      .badge {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 50;
        background: var(--ink);
        color: #fff;
        font: 500 11px/1 var(--font-ui);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 8px 12px;
        border-radius: 999px;
        opacity: 0.85;
      }

      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .suggestions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="badge">Design Draft · v1.2 · 暖色</div>

    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-text">
            <span class="brand-name">Personal</span>
            <span class="brand-sub">Emotion GPT</span>
          </div>
        </div>

        <button class="new-chat" type="button">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          新会话
        </button>

        <div class="nav-section">
          <div class="nav-label">空间</div>
          <button class="nav-item active" type="button">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            对话
          </button>
          <button class="nav-item" type="button">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            Agent
          </button>
          <button class="nav-item" type="button">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
            知识库
          </button>
        </div>

        <div class="nav-label" style="padding-left: 14px">最近</div>
        <div class="thread-list">
          <button class="thread active" type="button">心情不好怎么办</button>
          <button class="thread" type="button">介绍一下 MoCode</button>
          <button class="thread" type="button">LookJob 求职路径梳理</button>
          <button class="thread" type="button">本周复盘：焦虑与节奏</button>
        </div>

        <div class="sidebar-foot">
          <button class="workspace-pill" type="button" title="切换工作区">
            <span class="ws-avatar">Z</span>
            <span class="ws-meta">
              <div class="ws-name">Personal Workspace</div>
              <div class="ws-email">zero305747648@gmail.com</div>
            </span>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#9a8d84"
              stroke-width="2"
            >
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="mode-switch" role="tablist" aria-label="模式">
            <button class="mode-btn active" type="button">Chat</button>
            <button class="mode-btn" type="button">Agent</button>
          </div>
          <div class="top-actions">
            <button class="ghost-btn accent" type="button">知识库</button>
            <button class="ghost-btn" type="button">新会话</button>
          </div>
        </header>

        <div class="stage">
          <div class="empty">
            <div class="greeting">
              <h1>做个树洞吧</h1>
              <p>也可以了解我的经历与作品。选一个话题开始，或者直接告诉我你最近在想什么。</p>
            </div>

            <div class="suggestions">
              <button class="chip" type="button">
                <div class="chip-title">介绍一下 MoCode</div>
                <div class="chip-desc">了解项目背景与核心能力</div>
              </button>
              <button class="chip" type="button">
                <div class="chip-title">LookJob 怎么帮你找工作</div>
                <div class="chip-desc">求职流程与匹配思路</div>
              </button>
              <button class="chip" type="button">
                <div class="chip-title">介绍一下你自己</div>
                <div class="chip-desc">认识这位个人助手</div>
              </button>
              <button class="chip" type="button">
                <div class="chip-title">心情不好怎么办</div>
                <div class="chip-desc">慢慢说，这里先听你讲</div>
              </button>
            </div>
          </div>
        </div>

        <div class="composer-wrap">
          <div class="composer-tools">
            <span style="font-size: 12px; color: var(--muted)">当前：用户库检索</span>
            <label class="seed-toggle">
              <input type="checkbox" />
              同时检索种子库
            </label>
          </div>
          <div class="composer">
            <textarea rows="1" placeholder="想问点啥呢～"></textarea>
            <button class="send" type="button" aria-label="发送">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
              >
                <path d="M12 19V5M5 12l7-7 7 7" />
              </svg>
            </button>
          </div>
          <p class="hint">Enter 发送 · Shift+Enter 换行 · 内容可能不准确，仅供参考</p>
        </div>
      </main>
    </div>
  </body>
</html>
